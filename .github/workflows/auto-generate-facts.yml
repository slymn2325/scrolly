name: Auto Generate Daily Facts (GitHub Models)

on:
  schedule:
    - cron: '0 6,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  generate-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and save 6 bilingual facts via GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/generateFacts.mjs
