name: Auto Generate Daily Facts + Vocabulary (Heroku Postgres)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_cards_per_run:
        description: 'Total target cards to generate in this run (max 100)'
        required: false
        default: '25'
        type: choice
        options:
          - '25'
          - '50'
          - '100'
          - '10'

permissions:
  contents: read

jobs:
  generate-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate facts + vocabulary cards directly to Heroku Postgres
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODELS_ENDPOINT: ${{ vars.AI_MODELS_ENDPOINT }}
          AI_MODEL_NAME: ${{ vars.AI_MODEL_NAME || 'gemini-4-hydrogen' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_CARDS_PER_RUN: ${{ github.event.inputs.target_cards_per_run || vars.TARGET_CARDS_PER_RUN || '25' }}
          # Rejects overused internet trivia clichés (neutron star teaspoon, diamond rain, octopus 3 hearts, honey, Eiffel Tower, etc.)
          ANTI_CLICHE_STRICT: 'true'
        run: node scripts/generateFacts.mjs
